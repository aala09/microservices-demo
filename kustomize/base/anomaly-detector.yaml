apiVersion: apps/v1

kind: Deployment

metadata:

  name: anomaly-detector

  namespace: online-boutique-dev

  labels:

    app: anomaly-detector

    app.kubernetes.io/part-of: online-boutique

spec:

  replicas: 1

  selector:

    matchLabels:

      app: anomaly-detector

  template:

    metadata:

      labels:

        app: anomaly-detector

    spec:

      serviceAccountName: anomaly-detector

      containers:

      - name: anomaly-detector

        image: image-registry.openshift-image-registry.svc:5000/online-boutique-dev/anomaly-detector:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 5000

          name: http

        env:

        - name: PROMETHEUS_URL

          value: "https://prometheus-k8s-openshift-monitoring.apps.sno.openshift.local"

        - name: PROMETHEUS_TOKEN

          valueFrom:

            secretKeyRef:

              name: anomaly-detector-token

              key: token

        resources:

          requests:

            memory: "256Mi"

            cpu: "100m"

          limits:

            memory: "512Mi"

            cpu: "200m"

        livenessProbe:

          httpGet:

            path: /api/health

            port: 5000

          initialDelaySeconds: 30

          periodSeconds: 10

        readinessProbe:

          httpGet:

            path: /api/health

            port: 5000

          initialDelaySeconds: 10

          periodSeconds: 5

---

apiVersion: v1

kind: Service

metadata:

  name: anomaly-detector

  namespace: online-boutique-dev

spec:

  selector:

    app: anomaly-detector

  ports:

  - port: 5000

    targetPort: 5000

    name: http

---

apiVersion: route.openshift.io/v1

kind: Route

metadata:

  name: anomaly-detector

  namespace: online-boutique-dev

spec:

  to:

    kind: Service

    name: anomaly-detector

  port:

    targetPort: 5000

  tls:

    termination: edge
